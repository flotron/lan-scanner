name: Tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - run: python -m py_compile scanner.py
      - run: node --check static/app.js
      - run: bash -n install.sh install-online.sh update.sh uninstall.sh
      - run: pytest -q
      - run: bash tests/test_update.sh
      - run: bash tests/test_install_port.sh

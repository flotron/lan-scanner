name: Tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install pytest
      - run: python -m py_compile scanner.py preferences.py
      - run: node --check static/app.js
      - run: bash -n install.sh install-online.sh update.sh uninstall.sh
      - run: python -m pytest -q
      - run: npm install --prefix "$RUNNER_TEMP/ui-tests" linkedom@0.18.12
      - run: NODE_PATH="$RUNNER_TEMP/ui-tests/node_modules" node tests/test_watch_ui.cjs
      - run: bash tests/test_update.sh
      - run: bash tests/test_install_port.sh
      - run: bash tests/test_dependencies.sh

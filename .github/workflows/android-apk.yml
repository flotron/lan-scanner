name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install legacy Android platform
        run: sdkmanager "platforms;android-31"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build sideload APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: lan-scanner-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish permanent Android release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          TAG="android-v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "LAN Scanner Android ${VERSION}" \
              --notes "Standalone Android LAN scanner. Download and install lan-scanner-android.apk."
          fi
          cp android/app/build/outputs/apk/debug/app-debug.apk lan-scanner-android.apk
          gh release upload "$TAG" lan-scanner-android.apk --clobber
          gh release delete-asset "$TAG" app-debug.apk --yes >/dev/null 2>&1 || true
      - name: Attach APK to GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" android/app/build/outputs/apk/debug/app-debug.apk#lan-scanner-android.apk
